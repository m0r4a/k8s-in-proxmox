- name: Check if k3s agent binary exists
  ansible.builtin.stat:
    path: "{{ k3s_agent_binary }}"
  register: _k3s_agent_stat

- name: Read k3s node token from control plane
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: _k3s_token_raw
  no_log: true

- name: Set k3s node token fact
  ansible.builtin.set_fact:
    k3s_node_token: "{{ _k3s_token_raw.content | b64decode | trim }}"
  no_log: true

- name: Install k3s agent
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL {{ k3s_install_script_url }} | \
      INSTALL_K3S_EXEC="agent \
        --server https://{{ k8s_control_plane_ip }}:{{ k3s_api_port }} \
        --token {{ k3s_node_token }}" \
      sh -s -
  args:
    executable: /bin/bash
  when: not _k3s_agent_stat.stat.exists
  no_log: true
  changed_when: true

- name: Ensure k3s-agent service is started and enabled
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
