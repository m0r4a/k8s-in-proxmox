seaweedfs_image: "chrislusf/seaweedfs:latest"
seaweedfs_s3_port: 8333
seaweedfs_master_port: 9333
seaweedfs_filer_port: 8888
seaweedfs_volume_port: 8080

# Address the master advertises for the volume server; clients connect to it.
seaweedfs_advertise_ip: "{{ ansible_default_ipv4.address }}"

# Every port SeaweedFS listens on: HTTP ports plus their gRPC port (+10000).
seaweedfs_firewall_ports:
  - "{{ seaweedfs_s3_port }}"
  - "{{ seaweedfs_master_port }}"
  - "{{ seaweedfs_master_port | int + 10000 }}"
  - "{{ seaweedfs_filer_port }}"
  - "{{ seaweedfs_filer_port | int + 10000 }}"
  - "{{ seaweedfs_volume_port }}"
  - "{{ seaweedfs_volume_port | int + 10000 }}"

seaweedfs_data_dir: "/mnt/data/seaweedfs"
seaweedfs_compose_dir: "/opt/seaweedfs"

seaweedfs_data_filesystem: "ext4"
seaweedfs_data_mountpoint: "/mnt/data"

seaweedfs_firewall_enabled: false
seaweedfs_allowed_cidr: ""
