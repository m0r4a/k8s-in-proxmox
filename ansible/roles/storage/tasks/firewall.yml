- name: Check seaweedfs_allowed_cidr
  ansible.builtin.assert:
    that: seaweedfs_allowed_cidr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
    fail_msg: >-
      seaweedfs_firewall_enabled is true but seaweedfs_allowed_cidr is
      "{{ seaweedfs_allowed_cidr }}". Set it to the cluster subnet in
      inventory.d/group_vars/storage.yml (e.g. "10.0.0.0/24").
    quiet: true

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true

- name: Allow SeaweedFS ports from seaweedfs_allowed_cidr
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ seaweedfs_allowed_cidr }} port port={{ item }} protocol=tcp accept"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ seaweedfs_firewall_ports }}"

- name: Drop SeaweedFS ports from other sources
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: disabled
    immediate: true
  loop: "{{ seaweedfs_firewall_ports }}"
