- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: "{{ cluster_admin_home }}/.kube"
    state: directory
    owner: "{{ cluster_admin_user }}"
    group: "{{ cluster_admin_user }}"
    mode: "0700"

# k3s writes k3s.yaml readable by the admin user's group
# (--write-kubeconfig-group), and its kubectl reads that file whenever
# KUBECONFIG is unset. A link instead of a copy keeps ~/.kube/config current
# when k3s rotates its certificates.
- name: Link kubeconfig for admin user
  ansible.builtin.file:
    src: "{{ k3s_kubeconfig_src }}"
    dest: "{{ cluster_admin_home }}/.kube/config"
    state: link
    force: true
