- name: Check if Cilium Helm release exists
  ansible.builtin.command:
    cmd: helm list -n kube-system -q --filter ^cilium$
  become: true
  become_user: "{{ cluster_admin_user }}"
  environment:
    KUBECONFIG: "{{ cluster_admin_home }}/.kube/config"
  register: _cilium_release
  changed_when: false
  failed_when: false

- name: Copy Cilium values to the control plane
  ansible.builtin.copy:
    src: "{{ cilium_values_file }}"
    dest: "{{ cluster_admin_home }}/cilium-values.yaml"
    owner: "{{ cluster_admin_user }}"
    group: "{{ cluster_admin_user }}"
    mode: "0644"
  when: cilium_values_url | length == 0

- name: Install Cilium via Helm
  ansible.builtin.command:
    cmd: >-
      helm install cilium oci://quay.io/cilium/charts/cilium
      --version {{ cilium_chart_version }}
      --namespace kube-system
      --create-namespace
      -f {{ cilium_values_url if cilium_values_url | length > 0 else cluster_admin_home ~ '/cilium-values.yaml' }}
      --set k8sServiceHost={{ k8s_control_plane_ip }}
      --set k8sServicePort={{ k3s_api_port }}
      --set ipam.operator.clusterPoolIPv4PodCIDRList={{ '{' ~ k8s_cluster_cidr ~ '}' }}
      --set hubble.metrics.serviceMonitor.enabled=false
      --wait
  become: true
  become_user: "{{ cluster_admin_user }}"
  environment:
    KUBECONFIG: "{{ cluster_admin_home }}/.kube/config"
  when: "'cilium' not in _cilium_release.stdout"
  changed_when: true
