- name: Check Kubernetes distribution
  hosts: k8s_cluster
  gather_facts: false
  tasks:
    # "none" prepares the nodes (common, k8s_prep) and installs no Kubernetes.
    - name: Fail on a distribution without roles
      ansible.builtin.assert:
        that: k8s_distribution in ["k3s", "none"]
        fail_msg: "k8s_distribution={{ k8s_distribution }} has no roles yet (supported: k3s, none)."
      run_once: true
      tags: [always]

- name: Common node preparation
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]

- name: Kubernetes node preparation
  hosts: k8s_cluster
  become: true
  gather_facts: true
  roles:
    - role: k8s_prep
      tags: [prep]

- name: Bootstrap k3s control plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: k3s_server
      when: k8s_distribution == "k3s"
      tags: [k3s, server]

- name: Join k3s workers
  hosts: worker
  become: true
  gather_facts: true
  roles:
    - role: k3s_agent
      when: k8s_distribution == "k3s"
      tags: [k3s, agent]

- name: Configure storage nodes
  hosts: storage
  become: true
  gather_facts: true
  roles:
    - role: storage
      tags: [storage]
